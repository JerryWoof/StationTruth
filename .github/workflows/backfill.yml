name: Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "days of history (obs: Data API ~2-4 weeks; ECMWF IFS ~4 days, AIFS ~3 days, ICON latest run only; GFS/AIGFS months)"
        default: "7"
      models:
        description: "comma-separated models (ecmwf, gfs, icon, aifs, aigfs) or all; empty for none"
        default: "all"
      obs:
        description: "backfill observations too"
        type: boolean
        default: true
      tafs:
        description: "backfill TAFs too (Data API keeps ~30 days; ~4 min per day)"
        type: boolean
        default: false

permissions:
  contents: write

# Shares the forecast lock so a backfill never races collect-fcst on the same run.
concurrency:
  group: collect-fcst
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Backfill
        run: >-
          stationtruth backfill
          --days "${{ inputs.days }}"
          --models "${{ inputs.models }}"
          ${{ !inputs.obs && '--no-obs' || '' }}
      - name: Backfill TAFs
        if: ${{ inputs.tafs }}
        run: python -m stationtruth.tafs backfill --days "${{ inputs.days }}"
