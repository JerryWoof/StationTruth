name: Collect observations

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the site rebuild

concurrency:
  group: collect-obs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      # The METAR cache holds only the latest report per station; the last 2 h
      # from the Data API add half-hourly reports and SPECIs between runs.
      - name: Collect latest METARs
        run: stationtruth collect-obs --recent-hours 2
      - name: Collect latest TAFs
        run: python -m stationtruth.tafs collect
      # Runs started by the keeper use GITHUB_TOKEN, and GitHub does not fire
      # workflow_run for those, so start the site rebuild explicitly.
      - name: Rebuild site
        if: success()
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
