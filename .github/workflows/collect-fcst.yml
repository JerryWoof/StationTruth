name: Collect forecasts

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "ecmwf, gfs or all"
        default: all
      runs:
        description: "max new runs per model"
        default: "2"

permissions:
  contents: write
  actions: write # to start the site rebuild

concurrency:
  group: collect-fcst
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Collect new model runs
        run: >-
          stationtruth collect-fcst
          --model "${{ inputs.model || 'all' }}"
          --runs "${{ inputs.runs || '2' }}"
      # Runs started by the keeper use GITHUB_TOKEN, and GitHub does not fire
      # workflow_run for those, so start the site rebuild explicitly.
      - name: Rebuild site
        if: success()
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
