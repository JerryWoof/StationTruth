name: Keeper

# Fallback timer: GitHub's cron scheduler can be delayed for hours (it never
# fired for this repo's first day). This job stays alive for ~5.5 h, dispatches
# the collectors on time, then re-dispatches itself. The collectors keep their
# own schedules too; duplicate runs are harmless (data is deduplicated).
on:
  workflow_dispatch:
    inputs:
      handover:
        description: "started by the previous keeper (skip the already-running check)"
        type: boolean
        default: false
  schedule:
    - cron: "15 */6 * * *"

permissions:
  actions: write
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      # The 6-hourly schedule only restarts the keeper if a handover failed.
      # If another keeper is already running, this run exits right away
      # (no queueing, so no cancelled runs piling up).
      - name: Exit if a keeper is already running
        id: guard
        run: |
          if [ "${{ inputs.handover }}" = "true" ]; then echo "others=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh run list --repo "$REPO" --workflow keeper.yml --status in_progress \
                --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          echo "others=$n" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] && echo "Another keeper is running; nothing to do." || true
      - name: Dispatch collectors on the hour
        if: steps.guard.outputs.others == '0'
        run: |
          end=$(( $(date +%s) + 330*60 ))
          last_obs="" ; last_fcst=""
          while [ "$(date +%s)" -lt "$end" ]; do
            hour=$(date -u +%Y%m%d%H); h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M)))
            if [ "$m" -ge 7 ] && [ "$last_obs" != "$hour" ]; then
              gh workflow run collect-obs.yml --repo "$REPO" && last_obs=$hour
            fi
            if [ $((h % 3)) -eq 0 ] && [ "$m" -ge 20 ] && [ "$last_fcst" != "$hour" ]; then
              gh workflow run collect-fcst.yml --repo "$REPO" && last_fcst=$hour
            fi
            sleep 60
          done
      # Retire once GitHub's own cron works: if collect-obs.yml had at least 2 scheduled
      # runs in the last 3 hours (cron keeping pace, not just one stray run), retire.
      - name: Hand over to the next keeper (unless cron works)
        if: always() && steps.guard.outputs.others == '0'
        run: |
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "$REPO" --workflow collect-obs.yml --event schedule --limit 20 \
                --json createdAt --jq "[.[] | select(.createdAt > \"$since\")] | length")
          if [ "${n:-0}" -ge 2 ]; then
            echo "GitHub cron is running ($n scheduled runs in 3 h); keeper retires."
          else
            gh workflow run keeper.yml --repo "$REPO" -f handover=true
          fi
